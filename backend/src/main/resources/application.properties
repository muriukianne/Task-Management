# ── API Metadata ──────────────────────────────────────────────────────────────
api.v1.tm.success-message=Success
api.v1.tm.success-response-code=200
api.v1.tm.validate-error-code=400
api.v1.tm.web-client-pool-size=50

# ── Database Configuration ───────────────────────────────────────────────────
# NOTE: Do not interpolate generic DATABASE_URL / DATABASE_USER — leftover OS env
# vars (e.g. old cloud placeholders) silently override and break startup.
# Use TM_JDBC_URL / TM_JDBC_USER / DATABASE_PASSWORD from backend/.env instead.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${TM_JDBC_URL:jdbc:postgresql://localhost:5432/taskmanagement}
quarkus.datasource.username=${TM_JDBC_USER:tm}

# Required from backend/.env in packaged/prod runs; falls back to the local
# dev password so `mvnw test` works without env setup.
quarkus.datasource.password=${DATABASE_PASSWORD:tm}

# Keep connections stable on the local instance
quarkus.datasource.jdbc.background-validation-interval=2m
quarkus.datasource.jdbc.validation-query-sql=SELECT 1

# quarkus:dev → local Postgres (see db/README.md).
%dev.quarkus.datasource.jdbc.url=${TM_JDBC_URL:jdbc:postgresql://localhost:5432/taskmanagement}
%dev.quarkus.datasource.username=${TM_JDBC_USER:tm}
%dev.quarkus.datasource.password=${DATABASE_PASSWORD:tm}

# ── Test profile: isolated local DB + fully offline security ─────────────────
# mvnw test connects to the local taskmanagement_test database (create it once
# via the commands in db/README.md) and never opens a network connection to an
# external identity provider — JWTs are verified against the local RSA key pair
# in src/test/resources (see TestTokens for how tests mint them).
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/taskmanagement_test
%test.quarkus.datasource.username=tm
%test.quarkus.datasource.password=tm
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8089/offline}
%test.mp.jwt.verify.publickey.location=test-public-key.pem
%test.mp.jwt.verify.issuer=http://localhost:8089/offline
%test.smallrye.jwt.verify.clock.skew=300
# Tests mint tokens locally with the paired RSA private key (gitignored)
%test.smallrye.jwt.sign.key.location=test-private-key.pem
%test.smallrye.jwt.new-token.signature-algorithm=RS256
%test.smallrye.jwt.new-token.issuer=http://localhost:8089/offline
%test.tm.due-alerts.enabled=false

# ── Hibernate ORM & Schema Strategy ──────────────────────────────────────────
# Default is `none`: Hibernate must never create/alter/drop tables. Apply
# schema only via the ordered scripts in src/main/resources/db/ (see
# db/README.md). Override locally only when you intend to, e.g.
# DB_SCHEMA_STRATEGY=validate on CI.
quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:none}
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}

# Do not spin up Testcontainers/Docker Dev Services — local DB is explicit
quarkus.datasource.devservices.enabled=false

# ── OIDC & JWT Validation ─────────────────────────────────────────────────────
# Frontend secures the token from the IdP (Clerk); Quarkus validates the Bearer signature.
# OIDC_AUTH_SERVER_URL must be the Clerk Frontend API URL from the dashboard
# (same host encoded in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY).
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:backend}
quarkus.oidc.application-type=service
quarkus.oidc.devservices.enabled=false

# Ensures strict issuer verification matches token's 'iss' claim exactly
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:${OIDC_AUTH_SERVER_URL}}

# Absorb local/dev clock drift (Windows time skew) so nbf/exp checks don't 401
quarkus.oidc.token.lifespan-grace=300
smallrye.jwt.verify.clock.skew=300

# Extracts the top-level "role" claim to align with your custom JwtHelper checks
quarkus.oidc.roles.role-claim-path=${OIDC_ROLE_CLAIM_PATH:role}
quarkus.oidc.discovery-enabled=true

# ── CORS ───────────────────────────────────────────────────────────────────────
# Handled by CORSFilter (cors.allowed-origins); do not enable quarkus.http.cors
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ── Upload Limits ──────────────────────────────────────────────────────────────
# Accommodates your endpoint maximum processing boundary (up to 10MB individual files)
quarkus.http.limits.max-body-size=50M

# ── Logging ────────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."api.v1.tm".level=${APP_LOG_LEVEL:DEBUG}
# requestId / correlationId are bound by RequestCorrelationFilter via MDC
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] [req=%X{requestId} corr=%X{correlationId}] %s%e%n

# ── Due-date alerts (scheduled notifications) ─────────────────────────────────
# Cron: every day at 08:00 (server local time). Use every 5m in local testing if needed.
tm.due-alerts.enabled=${DUE_ALERTS_ENABLED:true}
tm.due-alerts.cron=${DUE_ALERTS_CRON:0 0 8 * * ?}
tm.due-alerts.soon-days=${DUE_ALERTS_SOON_DAYS:3}
