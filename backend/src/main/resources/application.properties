# ── API Metadata ──────────────────────────────────────────────────────────────
api.v1.tm.success-message=Success
api.v1.tm.success-response-code=200
api.v1.tm.validate-error-code=400
api.v1.tm.web-client-pool-size=50

# ── Database Configuration (Aiven Dedicated PostgreSQL) ──────────────────────
# NOTE: Do not interpolate generic DATABASE_URL / DATABASE_USER — leftover OS env
# vars (e.g. old Supabase placeholders) silently override and break startup.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://taskmanagement-0123-taskmanagement0123.d.aivencloud.com:18974/defaultdb?sslmode=require
quarkus.datasource.username=avnadmin

# Strictly required from your local backend/.env file (No fallback prevents security leaks)
quarkus.datasource.password=${DATABASE_PASSWORD}

# Keep connections stable on the dedicated machine instance
quarkus.datasource.jdbc.background-validation-interval=2m
quarkus.datasource.jdbc.validation-query-sql=SELECT 1

# ── Hibernate ORM & Schema Strategy ──────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:update}
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}

# Remote Aiven DB — do not spin up Testcontainers/Docker Dev Services
quarkus.datasource.devservices.enabled=false

# ── OIDC & JWT Validation ─────────────────────────────────────────────────────
# Frontend secures the token from the IdP (Clerk); Quarkus validates the Bearer signature.
# OIDC_AUTH_SERVER_URL must be the Clerk Frontend API URL from the dashboard
# (same host encoded in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY).
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:backend}
quarkus.oidc.application-type=service
quarkus.oidc.devservices.enabled=false

# Ensures strict issuer verification matches token's 'iss' claim exactly
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:${OIDC_AUTH_SERVER_URL}}

# Absorb local/dev clock drift (Windows time skew) so nbf/exp checks don't 401
quarkus.oidc.token.lifespan-grace=300
smallrye.jwt.verify.clock.skew=300

# Extracts the top-level "role" claim to align with your custom JwtHelper checks
quarkus.oidc.roles.role-claim-path=${OIDC_ROLE_CLAIM_PATH:role}
quarkus.oidc.discovery-enabled=true

# ── CORS ───────────────────────────────────────────────────────────────────────
# Handled by CORSFilter (cors.allowed-origins); do not enable quarkus.http.cors
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ── Upload Limits ──────────────────────────────────────────────────────────────
# Accommodates your endpoint maximum processing boundary (up to 10MB individual files)
quarkus.http.limits.max-body-size=50M

# ── Logging ────────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."api.v1.tm".level=${APP_LOG_LEVEL:DEBUG}